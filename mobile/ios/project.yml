name: FragmentRPC
options:
  bundleIdPrefix: dev.fragmentrpc
  deploymentTarget:
    iOS: '17.0'
packages:
  GraphQLDocuments:
    path: ../swift-graphql
  Connect:
    url: https://github.com/connectrpc/connect-swift.git
    exactVersion: 1.2.3
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    exactVersion: 1.31.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  FragmentRPC:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: ['**/*.graphql']
      - path: Generated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fragmentrpc.poc.ios
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_CFBundleDisplayName: Fragment RPC
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        TARGETED_DEVICE_FAMILY: '1,2'
    info:
      path: Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    dependencies:
      - package: GraphQLDocuments
        product: GraphQLDocuments
      - package: Connect
        product: Connect
      - package: SwiftProtobuf
    preBuildScripts:
      - name: Generate embedded GraphQL contracts
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "$SRCROOT/../.."
          bash scripts/build-native-tools.sh
          bash scripts/generate-ios.sh
  FragmentRPCTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FragmentRPC
  FragmentRPCUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FragmentRPC
schemes:
  FragmentRPC:
    build:
      targets:
        FragmentRPC: all
    test:
      targets:
        - FragmentRPCTests
        - FragmentRPCUITests
